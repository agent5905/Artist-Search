[project]
name = "artist-search"
version = "0.1.0"
description = "A search engine for finding game concept and character artists."
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "pillow>=12.3.0",
    "tldextract>=5.4.0",
    "torch>=2.14.1",
    "torchvision>=0.29.1",
    "transformers>=5.19.0",
]

[dependency-groups]
dev = ["mypy>=2.4", "pytest>=9.1", "ruff>=0.17"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
files = ["scripts", "pipeline"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# The system temp dir is not writable from every shell on this machine.
addopts = "--basetemp=.pytest_tmp"

# GPU build of PyTorch for the local analysis stage (RTX 5090, CUDA 13).
[[tool.uv.index]]
name = "pytorch-cu130"
url = "https://download.pytorch.org/whl/cu130"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu130" }
torchvision = { index = "pytorch-cu130" }
