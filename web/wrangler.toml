# Cloudflare Pages project (owner decision 9). Nothing here deploys: that is asked for separately.
name = "artist-search"
pages_build_output_dir = "dist"
compatibility_date = "2026-10-01"

# Workers AI: the search box's query becomes a bge-m3 embedding (functions/api/search.ts).
[ai]
binding = "AI"
remote = true # there is no local Workers AI: local runs call the real one too

# The limits per visitor are counted in the database (client_wait in sql/003_limits.sql), so nothing is set here.

# The functions also read VITE_SUPABASE_URL, and SUPABASE_SERVER_KEY: a Supabase secret key made for the site
# alone. Locally both come from .dev.vars (scripts/dev.mjs writes it). Hosted, the address is a variable of the
# Pages project and the key one of its secrets, which the owner sets and nothing here holds:
#   npx wrangler pages secret put SUPABASE_SERVER_KEY --project-name artist-search
